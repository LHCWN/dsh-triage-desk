name: check

on:
  # Branches are checked through their pull request; pushes check main only,
  # so a PR commit does not run every job twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full offline gate on Linux and Windows. The Linux leg keeps the plain
  # `check` name (the required status of `main`); the Windows leg reports as
  # `check (windows-latest)`. smoke:windows runs real PowerShell 5.1 launchers
  # there and skips elsewhere.
  check:
    name: ${{ matrix.os == 'ubuntu-latest' && 'check' || format('check ({0})', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # The paste wrapper has one implementation per platform family (Python pty on
  # macOS/Linux, C# over ConPTY on Windows). `npm run check` already runs its
  # smoke on ubuntu and Windows; this job adds macOS. It needs only Node (the
  # fake agent) and the runner's Python; no npm install.
  paste:
    name: paste (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev/smoke-paste.mjs
